name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        # `--if-present` must precede the script name, otherwise pnpm forwards it
        # to the script (`objectstack build --if-present` → "Nonexistent flag").
        run: pnpm -r --if-present test

  smoke:
    name: Smoke (todo dev server)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Boot todo dev server
        run: |
          pnpm --filter @objectlab/todo dev &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -sf http://localhost:4002/_console/ > /dev/null; then
              echo "✓ server reachable"
              kill $SERVER_PID || true
              exit 0
            fi
            sleep 2
          done
          echo "✗ server did not come up"
          kill $SERVER_PID || true
          exit 1
