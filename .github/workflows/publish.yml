name: Publish to marketplace

# Trigger on:
#   1. Push to main that touches a template package or the publish script
#      (auto-publish — re-runs are idempotent, no-op when version unchanged).
#   2. Manual dispatch with optional template filter (for backfills / hotfix).
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/publish-template.mjs'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      templates:
        description: 'Comma-separated package names to publish (empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (print payloads, no HTTP)'
        type: boolean
        default: false

concurrency:
  group: publish-marketplace
  # Don't cancel in-flight publishes — they're idempotent but a partial run
  # is preferable to a cancelled one (you'd retry the next push anyway).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish templates
    runs-on: ubuntu-latest
    # Optional: only run on the canonical repo, never on forks (where
    # OS_CLOUD_API_KEY is unavailable). Adjust to your org slug.
    if: github.repository == 'objectstack-ai/templates'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all templates
        run: pnpm -r build

      - name: Publish to marketplace
        env:
          OS_CLOUD_URL: ${{ vars.OS_CLOUD_URL }}
          OS_CLOUD_API_KEY: ${{ secrets.OS_CLOUD_API_KEY }}
          PUBLISH_TEMPLATES: ${{ inputs.templates }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/publish-template.mjs
