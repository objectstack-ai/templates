name: Bug report
description: Something in a template is broken
labels: [bug]
body:
  - type: dropdown
    id: template
    attributes:
      label: Which template?
      options:
        - todo
        - other / not template-specific
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual, error logs.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node, pnpm, @objectstack/runtime
      placeholder: node 22.x · pnpm 10.x · @objectstack/runtime 5.2.0
    validations:
      required: true
